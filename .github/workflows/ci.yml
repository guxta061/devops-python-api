name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  CONTAINER_NAME: devops-python-api

jobs:
  test:
    name: Testes automatizados
    runs-on: ubuntu-latest

    steps:
      - name: Obter o codigo
        uses: actions/checkout@v6

      - name: Preparar o Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependencias
        run: python -m pip install --requirement requirements-dev.txt

      - name: Executar testes
        run: pytest

  build-and-push:
    name: Build e push no ECR
    needs: test
    runs-on: ubuntu-latest
    environment: DES
    outputs:
      image: ${{ steps.meta.outputs.image }}
      registry: ${{ steps.login-ecr.outputs.registry }}

    steps:
      - name: Obter o codigo
        uses: actions/checkout@v6

      - name: Configurar credenciais da AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Definir nome da imagem
        id: meta
        run: echo "image=${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Construir e enviar a imagem
        run: |
          docker build -t "${{ steps.meta.outputs.image }}" .
          docker push "${{ steps.meta.outputs.image }}"

  deploy:
    name: Deploy na EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: DES

    steps:
      - name: Deploy via SSH
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          IMAGE: ${{ needs.build-and-push.outputs.image }}
          REGISTRY: ${{ needs.build-and-push.outputs.registry }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" \
            "IMAGE='$IMAGE' REGISTRY='$REGISTRY' REGION='$AWS_REGION' NAME='$CONTAINER_NAME' bash -s" <<'EOF'
          set -e

          echo "Login no ECR (via IAM Role da instancia)"
          aws ecr get-login-password --region "$REGION" \
            | docker login --username AWS --password-stdin "$REGISTRY"

          echo "Baixando a imagem $IMAGE"
          docker pull "$IMAGE"

          echo "Substituindo o container anterior"
          docker rm -f "$NAME" || true
          docker run -d --name "$NAME" --restart unless-stopped -p 8000:8000 "$IMAGE"

          echo "Verificando a aplicacao"
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8000/health; then
              echo
              docker ps --filter "name=$NAME"
              exit 0
            fi
            sleep 2
          done

          echo "A aplicacao nao respondeu"
          docker logs "$NAME"
          exit 1
          EOF

      - name: Limpar chave SSH
        if: always()
        run: rm -f ~/.ssh/ec2_key
